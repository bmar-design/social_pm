<div id="share-play-concepts" class="viz-carousel viz-dotted-background" aria-label="Share your play screen concepts">
  <section data-variant="Quick sheet"><div class="sp-stage"><div class="sp-phone" data-layout="sheet" aria-label="Quick share sheet"></div></div></section>
  <section data-variant="Play first" hidden><div class="sp-stage"><div class="sp-phone" data-layout="play" aria-label="Play first composer"></div></div></section>
  <section data-variant="Group first" hidden><div class="sp-stage"><div class="sp-phone" data-layout="group" aria-label="Group first sharing"></div></div></section>
</div>
<style>
#share-play-concepts{--sp-bg:light-dark(#fcf3e5,#281f19);--sp-card:light-dark(#fff8ef,#352920);--sp-text:light-dark(#442f22,#f9eadc);--sp-muted:light-dark(#85684e,#c7ac94);--sp-line:light-dark(#edd2af,#5c4432);--sp-orange:light-dark(#e66e4c,#e88c70);--sp-on:light-dark(#442f22,#291b14);--sp-soft:light-dark(#efd9bc,#4d3827);--sp-plum:light-dark(#582d7c,#d2a9ec);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--sp-text)}
#share-play-concepts *{box-sizing:border-box}#share-play-concepts .sp-stage{min-height:800px;display:flex;justify-content:center;padding:22px 8px}#share-play-concepts .sp-phone{width:374px;max-width:100%;min-height:740px;display:flex;flex-direction:column;padding:20px;background:var(--sp-bg);border:1px solid var(--sp-line);border-radius:30px;overflow:hidden}#share-play-concepts .sp-status{display:flex;justify-content:space-between;font-size:12px;margin:0 5px 26px;font-weight:600}#share-play-concepts .sp-row{display:flex;gap:12px;align-items:center}#share-play-concepts .sp-grow{flex:1;min-width:0}#share-play-concepts h2{font-size:27px;letter-spacing:-.8px;line-height:1.15;margin:0;font-weight:600}#share-play-concepts h3{font-size:15px;margin:24px 0 12px;font-weight:600}#share-play-concepts .sp-muted{color:var(--sp-muted);font-size:12px}#share-play-concepts .sp-kicker{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--sp-muted);margin-bottom:10px}#share-play-concepts button{font:inherit;color:inherit;cursor:inherit}#share-play-concepts .sp-icon{background:transparent;border:0;min-width:44px;min-height:44px;display:grid;place-items:center;padding:8px}#share-play-concepts .sp-pick{padding:18px;border:1px solid var(--sp-line);background:var(--sp-card);border-radius:18px;margin-top:22px}#share-play-concepts .sp-logo{width:44px;height:44px;background:var(--sp-soft);border-radius:50%;display:grid;place-items:center;font-size:21px;font-family:Georgia,serif;font-weight:700;flex-shrink:0}#share-play-concepts .sp-title{font-size:18px;font-weight:600;letter-spacing:-.3px}#share-play-concepts .sp-price{color:var(--sp-plum);font-size:17px;font-weight:600}#share-play-concepts .sp-divider{border-top:1px solid var(--sp-line);margin-top:18px;padding-top:13px;display:flex;justify-content:space-between;font-size:12px;color:var(--sp-muted)}#share-play-concepts .sp-group{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--sp-line);min-height:68px}#share-play-concepts .sp-group input{width:19px;height:19px;accent-color:var(--sp-text);flex-shrink:0}#share-play-concepts .sp-avatar{width:42px;height:42px;flex-shrink:0;background:var(--sp-soft);border-radius:15px;display:grid;place-items:center;font-size:15px}#share-play-concepts .sp-name{font-weight:600}#share-play-concepts textarea{width:100%;resize:vertical;min-height:85px;font:16px/1.4 inherit;font-family:inherit;font-size:16px;color:var(--sp-text);background:var(--sp-card);border:1px solid var(--sp-line);border-radius:15px;padding:13px;margin-top:9px}#share-play-concepts .sp-bottom{margin-top:auto;padding-top:24px}#share-play-concepts .sp-send{width:100%;min-height:51px;background:var(--sp-orange);color:var(--sp-on);border:0;border-radius:16px;font-weight:600;display:flex;justify-content:center;gap:10px;align-items:center}#share-play-concepts .sp-send:disabled{opacity:.45}#share-play-concepts .sp-hint{text-align:center;font-size:11px;color:var(--sp-muted);margin:10px 0 0}#share-play-concepts .sp-home{width:110px;height:4px;border-radius:5px;background:var(--sp-text);margin:24px auto 0;opacity:.65}#share-play-concepts .sp-handle{height:4px;width:36px;background:var(--sp-line);border-radius:5px;margin:0 auto 22px}#share-play-concepts .sp-context{padding:0 4px 28px;color:var(--sp-muted)}#share-play-concepts .sp-sheet{background:var(--sp-card);margin:0 -20px -20px;padding:12px 20px 20px;border-radius:26px 26px 0 0;border-top:1px solid var(--sp-line);flex:1;display:flex;flex-direction:column}#share-play-concepts .sp-sheet .sp-pick{background:var(--sp-bg);padding:13px;margin-top:18px}#share-play-concepts .sp-recipient{display:flex;gap:8px;align-items:center;margin-top:22px;background:var(--sp-soft);padding:12px;border-radius:14px}#share-play-concepts .sp-recipient select{flex:1;min-width:0;border:0;background:transparent;color:var(--sp-text);font:inherit}#share-play-concepts .sp-preview{margin-top:23px;padding-left:14px;border-left:2px solid var(--sp-line)}#share-play-concepts .sp-steps{display:flex;gap:7px;margin:20px 0 5px}#share-play-concepts .sp-steps span{height:3px;flex:1;background:var(--sp-line);border-radius:4px}#share-play-concepts .sp-steps span:first-child{background:var(--sp-orange)}#share-play-concepts .sp-message{font-size:13px;margin-top:13px}#share-play-concepts .sp-success{padding:14px 0;text-align:center;color:var(--sp-plum)}
</style>
<script>
(()=>{
const root=document.getElementById('share-play-concepts');
const groups=[['O','928 Oakland','8 members'],['S','Saturday crew','12 members'],['B','Big Ten takes','6 members']];
const pick=(full=false)=>`<div class="sp-pick"><div class="sp-kicker">Your play · NCAA Football</div><div class="sp-row"><div class="sp-logo">M</div><div class="sp-grow"><div class="sp-title">Michigan to win</div><div class="sp-muted">vs. Michigan State · Sat, 7:30 PM</div></div>${full?'<div class="sp-price">64¢</div>':''}</div>${full?'<div class="sp-divider"><span>Yes · Michigan</span><span>Practice play</span></div>':''}</div>`;
const rows=()=>groups.map((g,i)=>`<label class="sp-group cursor-interaction"><span class="sp-avatar">${g[0]}</span><span class="sp-grow"><span class="sp-name">${g[1]}</span><br><span class="sp-muted">${g[2]}</span></span><input type="checkbox" aria-label="Share to ${g[1]}" ${i===0?'checked':''}></label>`).join('');
const note='<label class="sp-note"><span class="sp-muted">Add your take <span>(optional)</span></span><textarea aria-label="Your take" placeholder="Why do you like this play?">Taking Michigan at home this weekend.</textarea></label>';
const bottom='<div class="sp-bottom"><button class="sp-send cursor-interaction" type="button"><span class="sp-action">Share to 1 group</span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button><div class="sp-success" aria-live="polite" hidden></div><p class="sp-hint">Shared to group chat · No order placed</p><div class="sp-home"></div></div>';
root.querySelectorAll('.sp-phone').forEach(phone=>{
const mode=phone.dataset.layout;
const header='<div class="sp-row"><div class="sp-grow"><h2>Share your play</h2></div><button class="sp-icon cursor-interaction" aria-label="Close preview"><i data-lucide="x" aria-hidden="true"></i></button></div>';
let content='';
if(mode==='sheet')content='<div class="sp-context"><div class="sp-kicker">Your position</div><div class="sp-title">Michigan to win</div><div class="sp-muted">Michigan State at Michigan</div></div><div class="sp-sheet"><div class="sp-handle"></div>'+header+pick()+'<h3>Send to your groups</h3>'+rows()+bottom+'</div>';
if(mode==='play')content=header+'<p class="sp-muted">A good play deserves a group chat.</p>'+pick(true)+'<div style="margin-top:22px">'+note+'</div><h3>Share with</h3>'+rows()+bottom;
if(mode==='group')content=header+'<div class="sp-steps"><span></span><span></span></div><div class="sp-recipient"><i data-lucide="users" aria-hidden="true"></i><select aria-label="Choose a group">'+groups.map(g=>'<option>'+g[1]+'</option>').join('')+'</select></div><div class="sp-preview"><div class="sp-kicker">Preview in group chat</div><div class="sp-row"><div class="sp-avatar">You</div><div><strong>You</strong><div class="sp-muted">Just now</div></div></div>'+pick(true)+'<div class="sp-message">Taking Michigan at home this weekend.</div></div><div style="margin-top:26px">'+note+'</div>'+bottom;
phone.innerHTML='<div class="sp-status"><span>9:41</span><span>●●● &nbsp; ▰</span></div>'+content;
const send=phone.querySelector('.sp-send'),action=phone.querySelector('.sp-action'),success=phone.querySelector('.sp-success');
const update=()=>{const n=mode==='group'?1:phone.querySelectorAll('input:checked').length;send.disabled=!n;action.textContent=mode==='group'?'Share to '+phone.querySelector('select').value:'Share to '+n+' group'+(n===1?'':'s');success.hidden=true;};
phone.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',update));
phone.querySelector('.sp-icon').addEventListener('click',()=>{success.textContent='Preview closed. Choose another concept below.';success.hidden=false;});
send.addEventListener('click',()=>{success.textContent='Shared! Preview only.';success.hidden=false;});
const textarea=phone.querySelector('textarea');if(mode==='group')textarea.addEventListener('input',()=>{phone.querySelector('.sp-message').textContent=textarea.value;});
const state={showNote:true};if(globalThis.Tweak&&textarea){const tweak=new Tweak({container:phone,onChange:()=>{phone.querySelector('.sp-note').hidden=!state.showNote;}});tweak.addToggle(state,'showNote',{label:'Include optional take'});}
update();
});
})();
</script>
