<div id="proposal-sketches" class="viz-carousel viz-dotted-background" aria-label="Cleaner chat proposal ideas">
  <section data-variant="Shared pick" aria-label="Shared pick design"><div class="stage"><div class="phone" data-design="shared"></div></div></section>
  <section data-variant="Inline message" aria-label="Inline message design" hidden><div class="stage"><div class="phone" data-design="inline"></div></div></section>
  <section data-variant="Match ticket" aria-label="Match ticket design" hidden><div class="stage"><div class="phone" data-design="ticket"></div></div></section>
</div>
<style>
#proposal-sketches{--sp-bg:light-dark(#f7f1e7,#25221e);--sp-card:light-dark(#fffaf2,#35302b);--sp-text:light-dark(#30271e,#f5eadc);--sp-muted:light-dark(#786b5a,#c2b3a1);--sp-line:light-dark(#ded3c3,#53493d);--sp-accent:light-dark(#766044,#dcc19c);--sp-own:light-dark(#e8ddca,#4a4032);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--sp-text)}
#proposal-sketches *{box-sizing:border-box}#proposal-sketches .stage{min-height:700px;padding:20px 8px;display:flex;justify-content:center;align-items:flex-start}#proposal-sketches .phone{width:370px;max-width:100%;background:var(--sp-bg);border:1px solid var(--sp-line);border-radius:30px;padding:20px 16px 12px}#proposal-sketches header{display:flex;gap:12px;align-items:center;margin-bottom:20px}#proposal-sketches .avatar{width:36px;height:36px;border-radius:50%;background:var(--sp-own);display:grid;place-items:center;font-weight:600}#proposal-sketches .sub{font-size:12px;color:var(--sp-muted)}#proposal-sketches .grow{flex:1}#proposal-sketches .switch{display:flex;border-radius:24px;background:var(--sp-own);padding:4px;margin-bottom:22px}#proposal-sketches .switch span{flex:1;padding:8px;text-align:center}#proposal-sketches .switch .selected{background:var(--sp-card);border-radius:20px}#proposal-sketches .date{text-align:center;font-size:11px;color:var(--sp-muted);margin-bottom:20px}#proposal-sketches .byline{font-size:12px;color:var(--sp-muted);margin:0 0 6px 4px}#proposal-sketches .bubble{background:var(--sp-card);border-radius:17px 17px 17px 4px;padding:12px 14px;max-width:90%;margin-bottom:20px}#proposal-sketches .proposal{background:var(--sp-card);border:1px solid var(--sp-line);border-radius:18px;padding:15px;margin-bottom:6px}#proposal-sketches .eyebrow{font-size:11px;letter-spacing:.08em;color:var(--sp-muted);text-transform:uppercase}#proposal-sketches .pick{display:flex;align-items:center;gap:12px;margin:12px 0}#proposal-sketches .team{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--sp-own);font-weight:600;color:var(--sp-accent)}#proposal-sketches .title{font-size:18px;font-weight:600}#proposal-sketches .note{margin:0 0 12px}#proposal-sketches button{font:inherit;color:inherit;background:transparent;border:0;cursor:inherit}#proposal-sketches .open{width:100%;padding:0;text-align:left}#proposal-sketches .footer{display:flex;align-items:center;justify-content:space-between;color:var(--sp-muted);font-size:12px;padding-top:12px;border-top:1px solid var(--sp-line)}#proposal-sketches .reaction{display:inline-block;background:var(--sp-own);border-radius:14px;padding:4px 9px;font-size:12px;margin:0 0 20px 4px}#proposal-sketches .own{margin-left:auto;background:var(--sp-own);border-radius:17px 17px 4px 17px;max-width:80%}#proposal-sketches .composer{display:flex;align-items:center;gap:12px;border:1px solid var(--sp-line);border-radius:25px;padding:12px 14px;margin-top:24px;color:var(--sp-muted)}#proposal-sketches .nav{display:flex;justify-content:space-around;border-radius:30px;background:var(--sp-own);margin-top:12px;padding:10px 5px}#proposal-sketches .nav span{font-size:11px;display:grid;justify-items:center;gap:3px;min-width:70px}#proposal-sketches .nav .active{border-radius:22px;background:var(--sp-card);padding:4px 12px}#proposal-sketches .inline-pick{border-top:1px solid var(--sp-line);padding-top:12px;margin-top:12px}#proposal-sketches .ticket-match{display:flex;justify-content:space-between;align-items:center;margin:16px 0}#proposal-sketches .ticket-team{display:grid;justify-items:center;gap:5px}#proposal-sketches .selection{background:var(--sp-own);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}#proposal-sketches .detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--sp-line);font-size:12px;color:var(--sp-muted)}
</style>
<script>
(()=>{
const root=document.getElementById('proposal-sketches');
const designs={
shared:`<div class="byline">Alex · 2:41 PM</div><div class="proposal"><button class="open cursor-interaction" aria-expanded="false"><div class="eyebrow">Shared pick</div><div class="pick"><div class="team">M</div><div class="grow"><div class="title">Michigan to win</div><div class="sub">vs. Michigan State · Sat, 7:30 PM</div></div><i data-lucide="chevron-right"></i></div><p class="note">Taking Michigan at home this weekend.</p><div class="footer"><span>3 Tail · 1 Fade</span><span>View position ↗</span></div></button><div class="detail" hidden>Michigan to win · Practice position<br>Price chart and Tail/Fade live in Positions.</div></div><div class="reaction">🔥 3</div>`,
inline:`<div class="byline">Alex · 2:41 PM</div><div class="bubble"><div>Taking Michigan at home this weekend.</div><button class="open inline-pick cursor-interaction" aria-expanded="false"><div class="pick" style="margin:0"><div class="team">M</div><div class="grow"><strong>Michigan to win</strong><div class="sub">vs. Michigan State</div></div><i data-lucide="arrow-up-right"></i></div><div class="sub" style="margin-top:10px">Shared pick · 3 Tail · 1 Fade</div></button><div class="detail" hidden>Practice position · Open in Positions for the price chart and Tail/Fade.</div></div><div class="reaction">🔥 3</div>`,
ticket:`<div class="byline">Alex · 2:41 PM</div><div class="proposal"><button class="open cursor-interaction" aria-expanded="false"><div class="eyebrow">NCAA Football · Sat, 7:30 PM</div><div class="ticket-match"><div class="ticket-team"><div class="team">M</div><span>Michigan</span></div><span class="sub">vs</span><div class="ticket-team"><div class="team">MSU</div><span>Michigan State</span></div></div><div class="selection"><div><div class="sub">Alex’s pick</div><strong>Michigan to win</strong></div><i data-lucide="arrow-up-right"></i></div><div class="footer" style="border:0"><span>3 Tail · 1 Fade</span><span>View position</span></div></button><div class="detail" hidden>Practice position · Price chart and Tail/Fade live in Positions.</div></div><div class="sub" style="margin:8px 4px">“Taking Michigan at home this weekend.”</div><div class="reaction">🔥 3</div>`};
root.querySelectorAll('.phone').forEach(phone=>{
phone.innerHTML=`<header><i data-lucide="chevron-left"></i><div class="avatar">O</div><div class="grow"><strong>928 Oakland</strong><div class="sub">8 members</div></div><i data-lucide="plus"></i></header><div class="switch"><span class="selected">Chat</span><span>Positions</span></div><div class="date">Today</div><div class="byline">Sam</div><div class="bubble">Who’s everyone taking Saturday?</div>${designs[phone.dataset.design]}<div class="bubble own">Home crowd is going to be loud</div><div class="composer"><span class="grow">Message your group…</span><i data-lucide="arrow-up"></i></div><div class="nav"><span><i data-lucide="house"></i>Home</span><span class="active"><i data-lucide="users"></i>Groups</span><span><i data-lucide="user"></i>Profile</span></div>`;
const open=phone.querySelector('.open'),detail=phone.querySelector('.detail');
open.addEventListener('click',()=>{detail.hidden=!detail.hidden;open.setAttribute('aria-expanded',String(!detail.hidden));});
const state={showReactions:true};const render=()=>{phone.querySelector('.reaction').hidden=!state.showReactions;};
if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:render});tweak.addToggle(state,'showReactions',{label:'Show reactions'});}
});
})();
</script>
